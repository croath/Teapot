[workspace]
resolver = "2"
members = ["core", "cli", "app-tauri", "app-ui"]
default-members = ["cli", "core"]

[workspace.package]
version = "0.1.8"
edition = "2024"
license = "MIT"
authors = ["Teapot contributors"]
repository = "https://github.com/croath/Teapot"
rust-version = "1.88"

[workspace.dependencies]
# Internal crates
teapot-core = { path = "core" }
teapot-ui = { path = "app-ui" }

# Async runtime
tokio = "1.53.1"
tokio-stream = "0.1.19"
futures = "0.3.33"
bytes = "1.12.1"

# HTTP server / client
axum = "0.8.9"
axum-extra = "0.12.6"
tower = "0.5.3"
tower-http = "0.6.6"
hyper = "1.11.0"
# default-features must be disabled at the workspace level so members can
# opt into rustls (or other TLS backends) explicitly.
reqwest = { version = "0.13.4", default-features = false }
mime = "0.3.17"

# TLS
rustls = "0.23.43"

# Serialization
serde = "1.0.229"
serde_json = "1.0.151"

# CLI
clap = "4.6.5"

# Observability
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

# Errors / utils
thiserror = "2.0.19"
anyhow = "1.0.104"
uuid = "1.24.0"
chrono = "0.4.45"
which = "8.0.5"
directories = "6.0.0"
toml = "0.8.23"
base64 = "0.22.1"
sha2 = "0.10.9"
rand = "0.9.2"
url = "2.5.7"
jsonwebtoken = "9.3.1"

# Tauri (desktop shell)
tauri = "2.11.5"
tauri-build = "2.6.3"
tauri-plugin-shell = "2.3.5"
tauri-plugin-updater = "2.10.1"
tauri-plugin-dialog = "2"
tauri-plugin-prevent-default = "5"

# Leptos (UI)
leptos = "0.8.20"
leptos_router = "0.8.15"
leptos_meta = "0.8.6"
leptos_ui = "0.3.22"
icons = "0.18.3"
tw_merge = "0.1.21"
strum = { version = "0.28.0", features = ["derive"] }
console_error_panic_hook = "0.1.7"
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4.76"
js-sys = "0.3.103"
web-sys = "0.3.103"
gloo-net = "0.6.0"
gloo-timers = { version = "0.3.0", features = ["futures"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
