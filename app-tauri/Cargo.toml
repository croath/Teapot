[package]
name = "teapot-tauri"
description = "Teapot desktop shell (Tauri)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "teapot_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# Keep `tauri` / `tauri-build` local (not workspace) so the Tauri CLI can rewrite features.
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["rustls-tls"] }
tauri-plugin-shell = { workspace = true }
tauri-plugin-updater = { workspace = true }
tauri-plugin-prevent-default = { workspace = true }

serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }

[target.'cfg(windows)'.dependencies]
tauri-plugin-prevent-default = { workspace = true, features = [
  "platform-windows",
] }
