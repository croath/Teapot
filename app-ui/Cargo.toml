[package]
name = "teaport-ui"
description = "Teaport Leptos CSR frontend (server control + playground)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { workspace = true, features = ["csr"] }
# leptos_router / leptos_meta: CSR is selected via leptos's `csr` feature;
# these crates only expose optional `ssr` (and related) features.
leptos_router = { workspace = true }
leptos_meta = { workspace = true }
leptos_ui = { workspace = true }
console_error_panic_hook = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
  "console",
  "Window",
  "Document",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlTextAreaElement",
  "HtmlSelectElement",
  "Storage",
  "Event",
  "KeyboardEvent",
  "Request",
  "RequestInit",
  "RequestMode",
  "Response",
  "Headers",
] }
gloo-net = { workspace = true, features = ["http"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
