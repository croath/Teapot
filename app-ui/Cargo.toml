[package]
name = "teapot-ui"
description = "Teapot Leptos CSR frontend (liquid glass desktop UI)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { workspace = true, features = ["csr"] }
# leptos_router / leptos_meta: CSR is selected via leptos's `csr` feature;
# these crates only expose optional `ssr` (and related) features.
leptos_router = { workspace = true }
leptos_meta = { workspace = true }
tw_merge = { workspace = true, features = ["variant"] }
icons = { workspace = true, features = ["leptos"] }
leptos_ui = { workspace = true }
# Added by rust-ui components (e.g. InputType)
strum = { workspace = true }
console_error_panic_hook = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
gloo-timers = { workspace = true, features = ["futures"] }
# Required by rust-ui Select scroll hooks + log export
web-sys = { workspace = true, features = [
  "Event",
  "EventTarget",
  "HtmlElement",
  "Element",
  "HtmlAnchorElement",
  "Blob",
  "BlobPropertyBag",
  "Url",
  "Window",
  "Document",
  "Storage",
  "Navigator",
] }

# Used by the rust-ui `ui` CLI to find the Tailwind entry
[package.metadata.leptos]
tailwind-input-file = "styles/tailwind.css"
